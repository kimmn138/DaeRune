; Stage1 · Stage2 에는 라이트 액터가 없다 — 발광 재질이 Lumen GI 로 주변을 밝히는 것이 조명의 전부다.
; 엔진 기본값(BaseScalability.ini)은 GI 품질 0 · 1(그래픽 품질 낮음 · 보통)에서 Lumen GI 를 끈다(r.Lumen.DiffuseIndirect.Allow=0).
; 그러면 발광 재질 말고는 화면이 전부 검게 나오므로, 낮음 · 보통에서도 Lumen GI 를 켜 둔다.
; Lumen 수치는 엔진의 GI 품질 2(높음) 값을 그대로 쓴다 — Lumen 을 켠 단계 중 가장 가벼운 값이다.
; 단 화면 프로브 두 값은 엔진 '에픽' 값으로 올린다(낮음 · 보통 · 높음 모두): 엔진 '높음'(프로브 1/32 · 확률적 보간)은
; 발광 재질 하나로만 밝히는 이 맵들에서 GI 가 프레임마다 자글거려 움직일 때 조명이 반짝였다.
; 1280x720 측정 — 평면 시간 노이즈 4.1% → 2.6%, Lumen 화면 프로브 패스 0.75 → 0.93ms.
; 나머지 키(DistanceFieldAO · 스카이 라이트 캡처 · 레이 트레이싱 씬)는 엔진의 각 단계 값을 그대로 둔다.

